    Experience:
      - company: Intelligent Control & Processing Co.
        position: AI Engineer
        location: Tehran, Iran (Hybrid)
        start_date: 2025-10
        end_date: present
        highlights:
          - Developed a local RAG-based voice chat using LangChain, Ollama LLM, JSON/ChromaDB and Sentence Transformers, with few-shot prompting and conversation memory for dialogues in voice mode.
          - Integrated Whisper (speech-to-text), a RAG-enhanced LLM and Coqui TTS into a full speech pipeline.
          - Implemented real-time speaker recognition with NVIDIA NeMo TitaNet and Resemblyzer, including voice activity detection and acoustic feature extraction.
          - Implemented real-time face recognition pipelines with YOLO for detection and ArcFace ResNet100 / InsightFace models for recognition.

      - company: Medical Image Analysis & Artificial Intelligence (MIAAI), Danube Private University
        position: AI Researcher
        location: Austria (Hybrid)
        start_date: 2023-09
        end_date: present
        highlights:
          - Content-based medical image retrieval using graph neural networks.
          - Graph neural networks, foundation models, histopathology image analysis and generative models.

      - company: FANAP Co.
        position: Marketing Data Scientist
        location: Tehran, Iran (Remote)
        start_date: 2021-07
        end_date: 2023-09
        highlights:
          - Collaborated with cross-functional teams to troubleshoot and optimize the performance of 10+ deployed AI services.
          - Designed and executed performance evaluations to assess model accuracy, speed and reliability.
          - Drafted RFPs and developed business plans to support initiatives within the AI open innovation ecosystem.
          - Authored technical articles and research briefs for the FANAP Research Team, promoting knowledge sharing and innovation.

      - company: FANAP Co.
        position: Data Scientist
        location: Tehran, Iran (Hybrid)
        start_date: 2018-10
        end_date: 2023-09
        summary: Worked in an agile environment with daily standups, sprint retrospectives, backlog grooming and continuous integration in two-week sprints.
        highlights:
          - "Medical image search engine (Dec 2022 - Sep 2023): medical image retrieval and classification with an attention-based adversarial variational graph autoencoder, pre-trained models and approximate nearest neighbor search."
          - "Contour drawing for a robot motion planning system (Mar 2022 - Jul 2022): contour extraction with image processing techniques for a drawing robot."
          - "Object detection app with REST API (Sep 2020 - Jul 2021): detection and segmentation frameworks, few-shot models and transfer learning."
          - "Video surveillance-based attendance and registration app with REST API (Jan 2021 - Mar 2021)."
          - "Automatic number plate recognition system (Jan 2021): vehicle registration, vehicle data search and display of top records by license plate."
          - "Visual search app with REST API (Jan 2020 - Sep 2020): object detection and recognition, color extraction, image web crawler, transfer learning and approximate nearest neighbor search."
          - "Value creation and clustering library (Aug 2019 - Jan 2020): SaaS metrics and KPIs, customer analysis and segmentation, cluster ensembles for the grocery retail industry."
          - "Customer behavior pattern mining on credit card transactions (Aug 2019 - Jan 2020) for fraud detection (money laundering, tax evasion)."
          - "Recommendation system (Mar 2019 - Aug 2019): sequence-to-sequence ranking model, association rules, hybrid, content and collaborative filtering, customer clustering and feature engineering for candidate generation."
          - "Marketing analysis and product prediction (Oct 2018 - Feb 2019) with CatBoost, XGBoost, LightGBM, ensembles and MLP."

