  sections:
    Experience:
      - company: Hyrcan Technology Development Co.
        position: AI Engineer
        location: Tehran, Iran (Hybrid)
        start_date: 2025-11
        end_date: present
        summary: Develop local generative AI and real-time identity recognition applications.
        highlights:
          - Built a local RAG-based voice assistant with LangChain, Ollama, JSON/ChromaDB, and Sentence Transformers.
          - Applied few-shot prompting and conversation memory to support contextual voice dialogue.
          - Integrated Whisper speech-to-text, RAG-enhanced LLM generation, and Coqui text-to-speech into a complete speech pipeline.
          - Implemented real-time speaker recognition with NVIDIA NeMo TitaNet and Resemblyzer, incorporating voice activity detection and acoustic feature extraction.
          - Implemented real-time face recognition pipelines using YOLO for detection and ArcFace ResNet100 / InsightFace for recognition.
      - company: Danube Private University Austria (DPU), MIAAI Group
        position: AI Researcher
        location: TFZ, Austria (Hybrid)
        start_date: 2023-09
        end_date: present
        summary: Research medical image retrieval and histopathology image analysis in the Medical Image Analysis & Artificial Intelligence (MIAAI) group.
        highlights:
          - Investigate graph neural networks and foundation models for content-based medical image retrieval.
          - Work on histopathological image classification using nuclei-based graph convolutional networks and foundation-model features.
          - Apply image classification, nuclei segmentation, and generative modeling methods to medical image analysis.
      - company: FANAP Co.
        position: Marketing Data Scientist
        location: Tehran, Iran (Remote)
        start_date: 2021-07
        end_date: 2023-09
        summary: Supported AI service evaluation and business development while contributing to applied research projects.
        highlights:
          - Collaborated with cross-functional teams to troubleshoot and optimize more than 10 deployed AI services.
          - Designed and executed evaluations of model accuracy, speed, and reliability; identified and reported anomalies in AI systems.
          - Drafted requests for proposals (RFPs) and business plans for initiatives in the AI open innovation ecosystem.
          - Authored technical articles and research briefs for the FANAP Research Team.
          - "Medical image search engine (Dec 2022–Sep 2023): worked on retrieval and classification using attention-based adversarial variational graph autoencoders, pretrained models, and approximate nearest-neighbor search."
          - "Drawing-robot motion planning (Mar–Jul 2022): developed image-processing methods to extract contours for a drawing robot."
          - Worked within an agile process using daily standups, sprint retrospectives, backlog grooming, and continuous integration in two-week sprints.
      - company: FANAP Co.
        position: Data Scientist
        location: Tehran, Iran (Hybrid)
        start_date: 2018-10
        end_date: 2021-07
        summary: Developed computer vision, recommendation, and customer analytics applications at FANAP.
        highlights:
          - "Object detection API (Sep 2020–Jul 2021): implemented detection and segmentation workflows using few-shot models and transfer learning."
          - "Video surveillance attendance API (Jan–Mar 2021): implemented an attendance and registration application."
          - "Automatic number plate recognition (Jan 2021): implemented vehicle registration, vehicle-data search, and ranked record display by license plate."
          - "Visual search API (Jan–Sep 2020): combined object detection and recognition, color extraction, image crawling, transfer learning, and approximate nearest-neighbor search."
          - "Customer analytics and clustering library (Aug 2019–Jan 2020): developed SaaS metrics and KPIs, segmentation, and cluster ensembles for numeric and categorical grocery-retail data."
          - "Transaction analysis (Aug 2019–Jan 2020): clustered customer behavior in credit-card transactions to support fraud detection, including money-laundering and tax-evasion analysis."
          - "Recommendation system (Mar–Aug 2019): developed sequence-to-sequence ranking, association rules, hybrid/content-based/collaborative filtering, customer clustering, and feature engineering for candidate generation."
          - "Marketing analysis and product prediction (Oct 2018–Feb 2019): applied CatBoost, XGBoost, LightGBM, ensemble methods, and multilayer perceptrons across business datasets."
          - Collaborated on fraud detection, chatbot, video surveillance, recommendation, and customer behavior analysis services.
          - Worked in two-week agile sprints with daily standups, retrospectives, backlog grooming, and continuous integration.
      - company: University of Isfahan
        position: Research Assistant
        location: Isfahan, Iran (On-site)
        start_date: 2019-10
        end_date: 2023-07
        summary: Conducted research on content-based medical image retrieval using graph neural networks.
        highlights:
          - Worked with graph neural networks, generative models, and foundation models for medical image analysis and retrieval.
