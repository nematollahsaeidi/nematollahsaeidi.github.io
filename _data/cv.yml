    Projects:
      - name: Medical Image Retrieval with Foundation Models
        summary: Evaluation of pre-trained CNNs and medical foundation models as feature extractors for content-based medical image retrieval.
        url: https://github.com/nematollahsaeidi/Medical-Image-Retrieval
      - name: Histology Image Classification with GNNs
        summary: Medical image classification using foundation model features in a graph neural network.
        url: https://github.com/nematollahsaeidi/his_img_GNN_classification
      - name: Photo-Sketch
        summary: Contour generation from input images for drawing-robot motion planning.
        url: https://github.com/nematollahsaeidi/Photo-Sketch
      - name: Content-Based Medical Image Retrieval across 2D and 3D Images
        summary: Investigated vision and vision-language foundation models for content-based retrieval across 2D and 3D medical images, including the effect of image size on retrieval performance.
      - name: Automatic Number Plate Recognition
        summary: Vehicle registration, vehicle-data search, and retrieval of records based on license plates.
      - name: Chatbot User Interface
        summary: Developed a chatbot user interface.
      - name: Fraud Detection and Transaction Analysis
        summary: Analyzed transaction data and customer behavior to identify anomalies and potential fraud risks.
      - name: Video Surveillance Attendance and Registration
        summary: Implemented an API-based attendance and registration application using video surveillance.
      - name: Object Detection Application
        summary: Developed object detection and segmentation workflows using few-shot models and transfer learning, exposed through a REST API.
      - name: Visual Search Application
        summary: Combined object detection and recognition, color extraction, image crawling, transfer learning, and approximate nearest-neighbor search.
      - name: Customer Behavior Analysis
        summary: Built customer segmentation and clustering workflows, including SaaS metrics, KPIs, cluster ensembles, and numeric and categorical clustering for grocery retail.
      - name: Recommendation System
        summary: Developed sequence-to-sequence ranking, association rules, hybrid/content-based/collaborative filtering, customer clustering, and candidate-generation features.
      - name: Marketing Analysis and Product Prediction
        summary: Applied CatBoost, XGBoost, LightGBM, ensemble methods, and multilayer perceptrons to marketing and prediction datasets.
      - name: Multi-Objective Binary Features for Image Representation and Recognition
        summary: Developed MATLAB implementations for robust binary feature extraction for face recognition and image representation.
      - name: Sugarscape Simulation with Reinforcement Learning
        summary: Developed an agent-based social simulation model using reinforcement learning as part of undergraduate research.
