cv:
  name: Nematollah (Emad) Saeidi
  headline: AI/ML Engineer and Researcher
  email: nemat.saeidi@gmail.com
  location: Wiener Neustadt, Austria
  summary: >-
    AI/ML engineer and researcher working across applied machine learning, computer vision, generative AI, and medical image analysis. Experience spans local RAG voice assistants, speaker and face recognition, visual search, recommendation systems, customer analytics, and research on graph neural networks and foundation models for medical image retrieval.
